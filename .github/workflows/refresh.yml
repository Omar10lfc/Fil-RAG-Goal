name: Refresh corpus

# Scrape newest articles, rebuild chunks + FAISS index, and commit updated data.
# Runs daily at midnight UTC or on manual trigger.
#
# Large artifacts (faiss_index/index.bin, faiss_index/metadata.jsonl,
# data/processed/chunks.jsonl) are tracked via Git LFS — see .gitattributes.
# data/raw/ stays gitignored.

on:
  schedule:
    - cron: '0 0 * * *'   # Daily at midnight UTC
  workflow_dispatch:        # Allow manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-corpus
  cancel-in-progress: true

jobs:
  refresh:
    name: Scrape & rebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Git LFS
        run: git lfs install

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # CPU-only torch keeps the install fast and small.
      - name: Install torch (CPU wheel)
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.2.0

      - name: Install project requirements
        run: pip install -r requirements.txt

      # Cache the sentence-transformers model (~400 MB) across runs.
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-model-${{ hashFiles('requirements.txt') }}
          restore-keys: hf-model-

      - name: Scrape newest articles
        run: python -m scraper.filgoal_scraper --newest-only

      - name: Run preprocessing pipeline
        run: python -m preprocessing.pipeline

      - name: Rebuild FAISS index (incremental)
        run: python -m preprocessing.build_index

      - name: Smoke-test FAISS index (gate before commit)
        run: python -m preprocessing.build_index --smoke-only

      - name: Commit updated corpus (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/chunks.jsonl faiss_index/
          git diff --cached --quiet || git commit -m "chore: daily corpus refresh [skip ci]"
          git push
